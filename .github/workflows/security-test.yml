name: Security Misconfiguration Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Test workflow
        run: echo "Testing workflow security configuration"

      - name: Check GitHub Actions security configuration
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .github/workflows
          framework: github_actions
          output_format: cli
          soft_fail: false
