name: Cloud DevOps Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  security-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Check application file
        run: |
          test -f index.html
          echo "Application file found successfully"

      - name: Secret security check
        run: |
          if grep -RniE "password=|api_key=|secret_key=|aws_access_key" --exclude-dir=.git --exclude='ci.yml' .; then
            echo "SECURITY ISSUE: Possible secret detected!"
            exit 1
          else
            echo "Secret scan passed - No obvious secrets detected"
          fi
          
      - name: Dependency security check
        run: |
          echo "Running dependency security scan..."
          npm install --package-lock-only
          npm audit --audit-level=high

          
      - name: Build Docker image
        run: docker build -t cloud-devops-security:latest .

      - name: Docker image security scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloud-devops-security:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Infrastructure as Code Security Scan
        run: |
          pip install checkov
          checkov -d infrastructure  
      - name: Security gate
        run: |
          echo "Security Gate: PASSED"
          echo "No blocking security issues detected."

      - name: Pipeline completed
        run: echo "Secure CI/CD pipeline completed successfully"
        
     
